<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Contact Our Department</h1>
    <p>We are here to help you</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="faculty.html">Faculty</a>
    <a class="active" href="contact.html">Contact</a>
</nav>

<main>
    <h2 class="section-title">Get in Touch</h2>

    <div class="cards">
        <article class="card">
            <div class="card-icon">✉️</div>
            <h3>Email</h3>
            <p>cse@example.com</p>
        </article>

        <article class="card">
            <div class="card-icon">📞</div>
            <h3>Phone</h3>
            <p>+91 98765 43210</p>
        </article>

        <article class="card">
            <div class="card-icon">📍</div>
            <h3>Location</h3>
            <p>College Campus, Telangana, India</p>
        </article>
    </div>

    <section class="contact-form">
        <h2>Send Us a Message</h2>

        <form onsubmit="event.preventDefault(); alert('Demo only: connect a backend to send your message.');">
            <label for="name">Your Name</label>
            <input id="name" type="text" placeholder="Enter your name" required>

            <label for="email">Your Email</label>
            <input id="email" type="email" placeholder="Enter your email" required>

            <label for="message">Message</label>
            <textarea id="message" rows="4" placeholder="Write your message" required></textarea>

            <button class="button" type="submit">Send Message</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 College Computer Science Department. All rights reserved.</p>
</footer>

</body>
</html>
